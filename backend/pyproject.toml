[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "feedparser>=6.0.14",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
]
[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
