# Runs the ingestion pipeline once a day: fetch feeds, research and write
# new stories, save them to Neon. Each run starts fresh, does one pass, and
# exits — nothing runs (or costs anything) between runs.
#
# A run fails (and GitHub emails you) if any feed can't be fetched or any
# article fails to process. Logs for every run are under the Actions tab.
#
# Needs repository secrets: GOOGLE_API_KEY, TAVILY_API_KEY, DATABASE_URL.

name: Ingest articles

on:
  schedule:
    # 13:17 UTC = early morning US time, so the feed is fresh when people
    # wake up. Minute 17, not :00 — GitHub's scheduler is busiest on the
    # hour and delays or drops more runs then.
    - cron: "17 13 * * *"
  # Adds a "Run workflow" button in the Actions tab for manual runs.
  workflow_dispatch:

# Never run two ingestions at once (they'd race to save the same articles).
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --locked --no-dev

      - name: Run ingestion
        run: uv run python scheduler.py --once
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_INPUT_USD_PER_MTOK: "0.30"
          LLM_OUTPUT_USD_PER_MTOK: "2.50"
          SEARCH_USD_PER_CALL: "0.008"
