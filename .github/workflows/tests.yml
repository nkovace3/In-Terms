# Runs the backend test suite on every push and pull request.
#
# Unit tests need nothing external. Integration tests need Postgres +
# pgvector, so this spins up a throwaway database container for the run —
# your real Neon database is never touched, and no secrets are needed.

name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interms_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before running steps.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interms_test
      # Settings requires these to exist; tests never call the real APIs.
      GOOGLE_API_KEY: test-not-used
      TAVILY_API_KEY: test-not-used

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --locked

      - name: Set up database schema
        run: |
          # No migration creates the pgvector extension (it was enabled by
          # hand on Neon), so a fresh database needs it first.
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
          uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Integration tests
        run: uv run pytest tests/integration -v
